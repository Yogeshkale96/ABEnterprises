<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="AB Enterprises Private Limited">
  <defs>
    <linearGradient id="abGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2D5C"/>
      <stop offset="0.55" stop-color="#0866D9"/>
      <stop offset="1" stop-color="#168BFF"/>
    </linearGradient>
    <linearGradient id="swoosh" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C8F0"/>
      <stop offset="0.6" stop-color="#168BFF"/>
      <stop offset="1" stop-color="#FFB800"/>
    </linearGradient>
  </defs>
  <!-- Monogram badge -->
  <g>
    <rect x="4" y="8" width="80" height="80" rx="18" fill="url(#abGrad)"/>
    <!-- circuit details -->
    <g stroke="#00C8F0" stroke-width="1.4" opacity="0.7" fill="none">
      <path d="M12 22 h14 M12 22 v10" stroke-linecap="round"/>
      <circle cx="12" cy="36" r="2.2" fill="#00C8F0" stroke="none"/>
      <path d="M76 74 h-14 M76 74 v-10" stroke-linecap="round"/>
      <circle cx="76" cy="60" r="2.2" fill="#00C8F0" stroke="none"/>
    </g>
    <text x="44" y="63" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
      font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="1">AB</text>
    <!-- gold-blue flow accent -->
    <path d="M8 82 C 28 74, 58 90, 82 78" stroke="url(#swoosh)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="98" y="42" font-size="26" font-weight="800" fill="#0B2D5C" letter-spacing="1.5">AB ENTERPRISES</text>
    <text x="98" y="62" font-size="12.5" font-weight="600" fill="#0866D9" letter-spacing="4">PRIVATE LIMITED</text>
    <text x="98" y="80" font-size="11.5" font-weight="500" fill="#64748B" font-style="italic">Tech Solutions for Every Need</text>
  </g>
</svg>
