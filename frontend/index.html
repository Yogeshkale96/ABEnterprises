    />
    <title>AB Enterprises Private Limited | Tech Solutions for Every Need</title>
    <script>
      // On refresh, always restart from the landing splash page.
      // Runs before the app mounts, so React Router sees "/" as the entry URL.
      (function () {
        var nav =
          performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
        if (nav && nav.type === 'reload' && location.pathname !== '/') {
          history.replaceState(null, '', '/');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
